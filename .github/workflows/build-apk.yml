name: Build Yawmi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q yawmi_android_project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p yawmi_android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Yawmi-APK
          path: yawmi_android/app/build/outputs/apk/debug/app-debug.apk
